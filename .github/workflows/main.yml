  - name: Configurar Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Instalar dependencias
    run: |
      pip install -r requirements.txt

  - name: Ejecutar Bot
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    run: |
      python bot.py
